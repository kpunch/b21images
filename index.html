<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profiles</title>
    <style>
        .profile-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            border: 1px solid #ccc;
        }

        .text-box {
            margin-top: 10px;
            padding: 10px;
            width: 150px;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .text-box div {
            margin: 2px 0;
        }

        .name { font-weight: bold; }
        .title { color: #555; }
        .company { color: #888; }

    </style>
</head>
<body>

<div class="profile-container">
    <div class="profile">
        <img src="path-to-image1.jpg" alt="Profile 1">
        <div class="text-box">
            <div class="name">Ron Shank</div>
            <div class="title">Oncology Sales Rep</div>
            <div class="company">Merck</div>
        </div>
    </div>

    <div class="profile">
        <img src="path-to-image2.jpg" alt="Profile 2">
        <div class="text-box">
            <div class="name">Karen W</div>
            <div class="title">Sr. Oncology AM</div>
            <div class="company">MorphoSys</div>
        </div>
    </div>

    <div class="profile">
        <img src="path-to-image3.jpg" alt="Profile 3">
        <div class="text-box">
            <div class="name">Brandy Williams</div>
            <div class="title">Sr. Sales Manager</div>
            <div class="company">Janssen Pharmaceutical</div>
        </div>
    </div>

    <div class="profile">
        <img src="path-to-image4.jpg" alt="Profile 4">
        <div class="text-box">
            <div class="name">Victor Yang</div>
            <div class="title">Regional Sales Manager</div>
            <div class="company">Novartis Oncology</div>
        </div>
    </div>
</div>

</body>
</html>
